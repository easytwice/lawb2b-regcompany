            - text: This Policy applies to information that the LAW B2B website at
            - strong [ref=e33]: lawb2b.ru
            - text: may receive about a user when they visit the website or submit an enquiry.
          - paragraph [ref=e34]: The LAW B2B website administration organises personal data processing, determines its purposes and takes steps to protect the information received.
          - paragraph [ref=e35]: The website may link to Telegram, WhatsApp and other third-party resources. LAW B2B does not control how those resources process data.
        - generic [ref=e36]:
          - heading "2. Data we process" [level=2] [ref=e37]
          - paragraph [ref=e38]: "A user may provide the following information through the enquiry form:"
          - list [ref=e39]:
            - listitem [ref=e40]: name;
            - listitem [ref=e41]: contact phone number;
            - listitem [ref=e42]: selected page language;
            - listitem [ref=e43]: confirmation of consent.
          - paragraph [ref=e44]: Technical information may also be processed automatically, including IP address, cookies, browser and device type, visit time, pages viewed, referral source and interactions with website elements.
        - generic [ref=e45]:
