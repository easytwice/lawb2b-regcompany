            - listitem [ref=e50]: provide information about company formation and support services;
            - listitem [ref=e51]: prepare a consultation and a project proposal;
            - listitem [ref=e52]: maintain stable and secure website operation;
            - listitem [ref=e53]: analyse traffic and improve the interface;
            - listitem [ref=e54]: comply with applicable legal requirements.
        - generic [ref=e55]:
          - heading "4. Cookies and analytics" [level=2] [ref=e56]
          - paragraph [ref=e57]: The website may use cookies and web analytics services, including Yandex Metrica and Google Analytics. These services help assess traffic sources, visits, device characteristics and visitor actions on the website.
          - paragraph [ref=e58]: Users can restrict cookies in their browser settings. This may affect certain website functions.
        - generic [ref=e59]:
          - heading "5. Processing and retention" [level=2] [ref=e60]
